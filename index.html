      padding: 0;

    }

    body, html {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      color: white;

      background-image: url('background.jpeg');

    .hero {

      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 20px;
      position: relative;
    }

    /* Fullscreen Video Background */
    .video-container {
      display: none;
    }

    /* Cricket Player Background Image */
    .cricket-bg {

    /* Glassmorphism Content Box */
    .content {
      z-index: 1;
      max-width: 550px;
      width: 100%;
      background: rgba(25, 25, 35, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 25px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-section {
      position: relative;
      width: 140px;
      margin: 0 auto;
      margin-top: -75px;
      margin-bottom: 5px;
    }

    .profile-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid transparent;
      margin: 0 auto;
      background: linear-gradient(#151520, #151520) padding-box, 
                  linear-gradient(135deg, #feca57, #ff9f43) border-box;
      box-shadow: 0 10px 30px rgba(255, 159, 67, 0.5);
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    .profile-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .profile-circle:hover img {
      transform: scale(1.1);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(255, 159, 67, 0.3); transform: scale(1); }
      100% { box-shadow: 0 0 40px rgba(255, 159, 67, 0.7), 0 0 80px rgba(255, 159, 67, 0.3); transform: scale(1.03); }
    }

    .name-container {
      margin-bottom: 5px;
    }

    h1.name {
      font-family: 'Poppins', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffffff, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      margin-bottom: 5px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    h3.name {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #b2bec3;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .timer-container {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      padding: 10px 30px;
      margin: 10px auto;
      display: inline-block;
      min-width: 220px;
      border: 1px solid rgba(255, 159, 67, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .counter {
      font-size: 4rem;
      font-weight: 900;
      color: #ff9f43;
      text-shadow: 0 0 25px rgba(255, 159, 67, 0.6);
      line-height: 1;
      margin-bottom: 5px;
      font-family: 'Poppins', sans-serif;
      transition: transform 0.1s ease-out;
      display: inline-block;
    }

    .info-time {
      font-size: 0.9rem;
      color: #dfe6e9;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .info-list {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .info-item {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 4px solid #00a8ff;
      display: inline-block;
      margin: 0 auto;
      max-width: 95%;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* Add a subtle highlight sweep */
    .info-item::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: sweep 3s infinite;
    }

    @keyframes sweep {
      0% { left: -100%; }
      50% { left: 200%; }
      100% { left: 200%; }
    }

    .info-item:hover {
      transform: translateX(8px);
      background: rgba(255, 255, 255, 0.12);
      border-left-color: #feca57;
    }

    .cta {
      margin: 35px 0 20px;
    }

    .cta a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(45deg, #0088cc, #00a8ff);
      color: white;
      text-decoration: none;
      padding: 20px 45px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 30px rgba(0, 136, 204, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      border: 2px solid transparent;
    }

    .cta a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: all 0.5s;
    }

    .cta a:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 15px 40px rgba(0, 136, 204, 0.6);
      border-color: rgba(255,255,255,0.3);
    }

    .cta a:hover::before {
      left: 100%;
    }

    .highlight {
      margin-top: 25px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #feca57;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      animation: flashWarning 2s infinite ease-in-out;
      text-shadow: 0 2px 10px rgba(254, 202, 87, 0.4);
    }

    @keyframes flashWarning {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.98); }

    /* A2 Circular Button - Lower Left Corner */
    .a2-button-container {
      position: fixed;
      bottom: 30px;
      left: 30px;
      z-index: 1000;
      animation: floatBtn 4s infinite ease-in-out;
    }

    @keyframes floatBtn {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .a2-button {
      position: relative;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 3px solid rgba(255,255,255,0.8);
    }

    .a2-button:hover {
      transform: scale(1.15) rotate(10deg);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }

    .a2-button img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    .circular-text {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      white-space: nowrap;
      letter-spacing: 1.5px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Split and Merge Text Animation Helper Classes */
    .splitMerge span.left {
      display: inline-block;
      opacity: 0;
      transform: translateX(-60px);
      animation: slideInRight 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .splitMerge span.right {
      display: inline-block;
      opacity: 0;
      transform: translateX(60px);
      animation: slideInLeft 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s;
    }

    @keyframes slideInRight {
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes slideInLeft {
      to { opacity: 1; transform: translateX(0); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .hero {
        padding: 15px;
        justify-content: flex-start;
        padding-top: 10vh;

      .content {

      .profile-section {

      h1.name { font-size: 2.2rem; }

      .timer-container {

      .cta a {

      .a2-button-container {

      }

      .a2-button {

        border-width: 2px;
      }

      .circular-text {
        font-size: 8px;
        top: -18px;
        padding: 3px 6px;
      }
    }
  </style>

  <script>
    // Timer Logic
    let counter = 20;
    const counterEl = document.getElementById("counter");
    const telegramLink = "https://t.me/+sMqDpVq73AIzYWI1";
    
    const timer = setInterval(() => {
      if (counter > 0) {
        counter--;
        counterEl.textContent = counter;
        
        // Add a "bump" animation every tick
        counterEl.style.transform = 'scale(1.15)';
        setTimeout(() => {
          if(counterEl) counterEl.style.transform = 'scale(1)';
        }, 150);
        
      } else {
        clearInterval(timer);
        // Add a final fade out before redirect
        document.body.style.transition = 'opacity 0.5s ease';
        document.body.style.opacity = '0';
        setTimeout(() => {
          window.location.href = telegramLink;
        }, 500);
      }
    }, 1000);

    // Split and merge text animation for main heading
    document.addEventListener("DOMContentLoaded", () => {
      const elements = document.querySelectorAll(".splitMerge");

      elements.forEach(el => {
        const text = el.innerText.trim();
        const half = Math.floor(text.length / 2);

        const leftText = text.slice(0, half);
        const rightText = text.slice(half);

        el.innerHTML = `
          <span class="left">${leftText}</span><span class="right">${rightText}</span>
        `;
      });
    });
  </script>
